    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Image Skeleton Loading animation */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>

        // Populate Gallery Grid

                    <div class="skeleton absolute inset-0"></div>
                    <img 
                        src="${item.url}" 
                        alt="" 
                        loading="lazy"
                        onload="this.previousElementSibling.style.display='none'"

    <!-- Lightbox Modal Overlay -->
    <div id="lightbox" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4 sm:p-8 transition-opacity duration-300 opacity-0 pointer-events-none" onclick="closeLightbox(event)">
        <div class="relative max-w-5xl w-full flex flex-col items-center justify-center pointer-events-auto" onclick="event.stopPropagation()">
            <!-- Close Button -->
            <button onclick="closeLightbox()" class="absolute -top-12 right-0 text-white/80 hover:text-white p-2 text-2xl font-semibold transition-colors focus:outline-none" aria-label="Close modal">
                ✕
            </button>
            <!-- Lightbox Image -->
            <div class="relative max-h-[85vh] overflow-hidden rounded-xl bg-slate-900 flex items-center justify-center shadow-2xl">
                <img id="lightboxImg" src="" alt="" class="max-h-[85vh] w-auto max-w-full object-contain rounded-xl">
            </div>
        </div>
    </div>

    <!-- Lightbox Controller Script -->
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        function openLightbox(id) {
            const item = galleryImages.find(img => img.id === id);
            if (!item) return;

            lightboxImg.src = item.url;

            lightbox.classList.remove('hidden', 'pointer-events-none');
            requestAnimationFrame(() => {
                lightbox.classList.remove('opacity-0');
            });

            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.add('opacity-0');
            setTimeout(() => {
                lightbox.classList.add('hidden', 'pointer-events-none');
                lightboxImg.src = '';
                document.body.style.overflow = 'auto';
            }, 300);
        }

        // Close on Escape key press
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) {
                closeLightbox();
            }
        });
    </script>
